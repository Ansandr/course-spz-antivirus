name: PR Build Artifacts

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release Artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Prepare package folder name
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($content, 'project\(\s*AntivirusMVP\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
          if ($match.Success) {
            $version = $match.Groups[1].Value
          } else {
            $version = '0.0.0'
          }
          $build = '${{ github.run_number }}'
          $artifactName = "antivirusmvp-$version.$build"
          $packageDir = 'artifact/antivirusmvp'
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_DIR=$packageDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Artifact name: $artifactName"
          Write-Host "Package directory: $packageDir"

      - name: Collect and deploy Release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PACKAGE_DIR -Force | Out-Null
          Copy-Item build/Release/AntivirusMVP.exe $env:PACKAGE_DIR/ -Force
          windeployqt --release $env:PACKAGE_DIR/AntivirusMVP.exe
          Copy-Item signatures.db $env:PACKAGE_DIR/ -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/
          if-no-files-found: error
