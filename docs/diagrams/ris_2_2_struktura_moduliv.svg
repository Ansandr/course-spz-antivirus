<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 500" width="1140" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { fill: #000; font-family: "Times New Roman", "Liberation Serif", serif; }
    .box  { fill: #fff; stroke: #000; stroke-width: 2; }
    .gui  { fill: #fff; stroke: #000; stroke-width: 2.5; }
    .store{ fill: #fff; stroke: #000; stroke-width: 2; stroke-dasharray: 6 3; }
    .lbl-b{ font-size: 16px; font-weight: bold; }
    .lbl  { font-size: 15px; }
    .sub  { font-size: 12px; }
    .edge { font-size: 12px; font-style: italic; }
    .flow { stroke: #000; stroke-width: 2; fill: none; }
    .title{ font-size: 18px; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="500" fill="#fff"/>

  <!-- GUI layer -->
  <rect class="gui" x="40" y="30" width="1060" height="84"/>
  <text class="title" x="570" y="62" text-anchor="middle">MainWindow — рівень представлення (GUI)</text>
  <text class="lbl" x="570" y="92" text-anchor="middle">QTabWidget: Сканування | Процеси | Карантин | Журнал | Налаштування</text>

  <!-- vertical connectors from GUI to modules -->
  <path class="flow" d="M130,114 L130,210" marker-end="url(#arrow2)"/>
  <text class="edge" x="138" y="150" text-anchor="start">signals/slots</text>
  <path class="flow" d="M330,114 L330,210" marker-end="url(#arrow2)"/>
  <text class="edge" x="338" y="150" text-anchor="start">виклик</text>
  <path class="flow" d="M555,114 L555,210" marker-end="url(#arrow2)"/>
  <text class="edge" x="563" y="150" text-anchor="start">виклик</text>
  <path class="flow" d="M790,114 L790,210" marker-end="url(#arrow2)"/>
  <text class="edge" x="798" y="150" text-anchor="start">виклик</text>
  <path class="flow" d="M1010,114 L1010,210" marker-end="url(#arrow2)"/>
  <text class="edge" x="1018" y="150" text-anchor="start">виклик</text>

  <!-- Module boxes (row 1) -->
  <rect class="box" x="55"  y="212" width="150" height="78"/>
  <text class="lbl-b" x="130" y="244" text-anchor="middle">Scanner</text>
  <text class="sub"   x="130" y="266" text-anchor="middle">(QThread)</text>

  <rect class="box" x="255" y="212" width="150" height="78"/>
  <text class="lbl-b" x="330" y="248" text-anchor="middle">ProcessList</text>

  <rect class="box" x="480" y="212" width="150" height="78"/>
  <text class="lbl-b" x="555" y="248" text-anchor="middle">Quarantine</text>

  <rect class="box" x="715" y="212" width="150" height="78"/>
  <text class="lbl-b" x="790" y="248" text-anchor="middle">ReportWriter</text>

  <rect class="box" x="935" y="212" width="150" height="78"/>
  <text class="lbl-b" x="1010" y="244" text-anchor="middle">Logger</text>
  <text class="sub"   x="1010" y="266" text-anchor="middle">(singleton)</text>

  <!-- connectors module -> store (row 2) -->
  <path class="flow" d="M130,290 L130,400" marker-end="url(#arrow2)"/>
  <text class="edge" x="138" y="350" text-anchor="start">lookup()</text>
  <path class="flow" d="M330,290 L330,400" marker-end="url(#arrow2)"/>
  <text class="edge" x="338" y="350" text-anchor="start">WinAPI</text>
  <path class="flow" d="M555,290 L555,400" marker-end="url(#arrow2)"/>
  <text class="edge" x="563" y="350" text-anchor="start">JSON-індекс</text>
  <path class="flow" d="M790,290 L790,400" marker-end="url(#arrow2)"/>
  <text class="edge" x="798" y="350" text-anchor="start">.txt звіт</text>
  <path class="flow" d="M1010,290 L1010,400" marker-end="url(#arrow2)"/>
  <text class="edge" x="1018" y="350" text-anchor="start">.log</text>

  <!-- Store boxes (row 2) -->
  <rect class="store" x="55"  y="402" width="150" height="74"/>
  <text class="lbl-b" x="130" y="434" text-anchor="middle">SignatureDB</text>
  <text class="sub"   x="130" y="456" text-anchor="middle">(QHash)</text>

  <rect class="store" x="255" y="402" width="150" height="74"/>
  <text class="lbl-b" x="330" y="434" text-anchor="middle">tlhelp32.h</text>
  <text class="sub"   x="330" y="456" text-anchor="middle">(WinAPI)</text>

  <rect class="store" x="480" y="402" width="150" height="74"/>
  <text class="lbl-b" x="555" y="434" text-anchor="middle">%APPDATA%</text>
  <text class="sub"   x="555" y="456" text-anchor="middle">Quarantine</text>

  <rect class="store" x="715" y="402" width="150" height="74"/>
  <text class="lbl-b" x="790" y="434" text-anchor="middle">scan_*.txt</text>

  <!-- antivirus.log target -->
  <rect class="store" x="935" y="402" width="150" height="74"/>
  <text class="lbl-b" x="1010" y="434" text-anchor="middle">antivirus.log</text>
</svg>
